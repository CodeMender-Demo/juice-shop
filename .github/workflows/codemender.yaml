name: CodeMender Security Scan

on:
  workflow_dispatch: 

permissions:
    contents: read
    id-token: write
    pull-requests: write
    security-events: write
    actions: read

jobs:
  planning:
    uses: Codemender-Demo/central-governance/.github/workflows/codemender.yml@main
    secrets:
      wif_provider: ${{ secrets.WIF_PROVIDER }}
      wif_service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
