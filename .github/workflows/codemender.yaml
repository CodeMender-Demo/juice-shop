name: Dynamic Monorepo Splitter

on:
  workflow_dispatch: 

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute Directory Chunks
        id: set-matrix
        run: |
          CHUNKS=$(python3 scripts/split_repo.py)
          echo "Generated chunks: $CHUNKS"
          
          # Wrap inside an object for GitHub Actions matrix compatibility
          echo "matrix={\"include\": $CHUNKS}" >> "$GITHUB_OUTPUT"

  process-chunk:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    name: "Chunk: ${{ matrix.path }} (${{ matrix.type }}, ${{ matrix.count }} files)"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Task for Directory Chunk
        if: ${{ matrix.type == 'directory' }}
        run: |
          echo "Processing directory: ${{ matrix.path }}"
          echo "Contains ${{ matrix.count }} files"
          # Example: pytest "${{ matrix.path }}" or eslint "${{ matrix.path }}"

      - name: Run Task for Loose Files Chunk
        if: ${{ matrix.type == 'files' }}
        run: |
          echo "Processing loose files under: ${{ matrix.path }}"
          # You can iterate over matrix.files
          echo '${{ toJSON(matrix.files) }}' | jq -r '.[]' | while read -r file; do
            echo "Processing $file"
          done
