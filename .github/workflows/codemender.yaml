name: Dynamic Monorepo Splitter

on:
  workflow_dispatch: 

jobs:
  planning:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute Directory Chunks
        id: set-matrix
        run: |
          CHUNKS=$(python3 scripts/split_repo.py)
          echo "Generated chunks: $CHUNKS"
          
          # Wrap inside an object for GitHub Actions matrix compatibility
          echo "matrix={\"include\": $CHUNKS}" >> "$GITHUB_OUTPUT"

  scan:
    needs: planning
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      security-events: write
    strategy:
      max-parallel: 25
      fail-fast: false
      matrix: ${{ fromJSON(needs.planning.outputs.matrix) }}
    name: "Chunk: ${{ matrix.path }} (${{ matrix.type }}, ${{ matrix.count }} files)"
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud securely
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      # Download and Install CodeMender On-The-Fly
      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender from Artifact Registry..."
          gcloud artifacts generic download \
            --project=cmoc-prod \
            --location=us \
            --repository=codemender-cli-production \
            --package=cm \
            --version=stable \
            --name=cm-linux-amd64.zip \
            --destination=./
            
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm
          cm init

      # Configure Git Identity for the Bot
      - name: Configure Git Identity
        run: |
          git config --global user.name "CodeMender Scan Bot"
          git config --global user.email "codemender-bot@google.com"

      # Move the credentials file out of the workspace to protect it from git clean
      - name: Protect Credentials File
        run: |
          mv $GOOGLE_APPLICATION_CREDENTIALS ${{ runner.temp }}/gha-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/gha-creds.json" >> $GITHUB_ENV
          echo "$GOOGLE_APPLICATION_CREDENTIALS"
      
      - name: Update config.yaml with file types
        shell: python
        run: |
          import os
          import yaml
    
          config_file = os.path.expanduser('~/.codemender/config.yaml')

          extensions_list = [
            ".aspx", 
            ".cshtml", 
            ".vbhtml", 
            ".php", 
            ".vue", 
            ".sql", 
            ".pkh", 
            ".pkb", 
            ".tsql", 
            ".abap",
            ".acds",
            ".abdl",
            ".cls", 
            ".trigger", 
            ".ipynb", 
            ".pl", 
            ".pm", 
            ".sh", 
            ".vb", 
            ".vbp", 
            ".frm", 
            ".bas", 
            ".cls-meta.xml", 
            ".pls"
          ]  
    
          # 2. Load existing config
          if os.path.exists(config_file):
              with open(config_file, 'r') as f:
                  config = yaml.safe_load(f) or {}
          else:
              print("Config not found")
              config = {}
    
          # Ensure the list key exists (assuming the key is 'file_types')
          list_key = 'include'
          if list_key not in config['scan']['extensions'] or config['scan']['extensions'][list_key] is None:
              config['scan']['extensions'][list_key] = []
    
          # 3. Add new extensions
          updated = False
          for ext in extensions_list:
            if ext not in config['scan']['extensions'][list_key]:
                  config['scan']['extensions'][list_key].append(ext)
                  updated = True
    
          # 4. Write back if changes were made
          if updated:
              with open(config_file, 'w') as f:
                  yaml.dump(config, f, default_flow_style=False)
              print(f"Updated {config_file} with new extensions:")
          else:
              print("No new extensions found.")

      - name: Print config.yaml
        run: |
          cat ~/.codemender/config.yaml
      
      - name: Resolve Scan Target
        id: target
        run: |
          if [ "${{ matrix.has_subdirectories }}" = "true" ]; then
            echo "Chunk has subdirectories. Staging into temporary folder..."
            
            python3 -c '
            import os, json, pathlib
            files = json.loads("""${{ toJSON(matrix.files) }}""")
            stage_dir = pathlib.Path("chunk_stage")
            
            for file_path in files:
                dest = stage_dir / file_path
                dest.parent.mkdir(parents=True, exist_ok=True)
                os.link(file_path, dest)'

            echo "scan_dir=chunk_stage" >> "$GITHUB_OUTPUT"
          else
            echo "Chunk is a leaf folder with no subdirectories. Scanning in-place..."
            echo "scan_dir=${{ matrix.path }}" >> "$GITHUB_OUTPUT"
          fi   
      
      - name: Find
        run: |
          echo "Scanning directory: ${{ steps.target.outputs.scan_dir }}"
          cm find ./${{ steps.target.outputs.scan_dir }}
          # Write a json report
          cm report --format json > codemender_report.json
      
      # Attach the chunk identifier so the aggregator can key it by path
      - name: Format Chunk Output
        if: always()
        run: |
          python3 - << 'EOF'
          import json, os

          with open("codemender_report.json") as f:
            chunk_data = json.load(f)

          payload = {
            "path": "${{ matrix.path }}",
            "type": "${{ matrix.type }}",
            "count": ${{ matrix.count }},
            "data": chunk_data  # your JSON list
          }

          # Give each file a unique filename so they don't overwrite each other
          job_idx = "${{ strategy.job-index }}"
          os.makedirs("chunk-output", exist_ok=True)
          with open(f"chunk-output/chunk-{job_idx}.json", "w") as f:
            json.dump(payload, f)
          EOF

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-result-${{ strategy.job-index }}
          path: chunk-output/
          retention-days: 1
      
      - name: Format SARIF Report for GitHub UI
        if: always()
        run: |
          python3 -c '
          import json, re, os
          # GitHub input variable to extract relative path dynamically
          repo_name = "${{ github.repository }}"
          repo_short_name = repo_name.split("/")[-1]
          # Load JSON export
          with open("codemender_report.json", "r") as f:
              findings = json.load(f)
          # Initialilze lists and sets
          rules = []
          results = []
          seen_rules = set()
      
          # Map custom severity scales to SARIF levels
          severity_map = {
              "CRITICAL": "error",
              "HIGH": "error",
              "MEDIUM": "warning",
              "LOW": "note",
              "INFO": "note"
          }

          for finding in findings:
              # Filter out un-verified findings
              if finding.get("status") not in ["VERIFIED", "FIXED"]:
                  continue

              rule_id = finding.get("title", "Unknown-Rule")
              short_desc = finding.get("title", "Security Finding")
              analysis = finding.get("analysis", "")

              # Calculate relative_path for location uri
              file_path = finding.get("file_path", "unknown")
              relative_path = ""
              if repo_short_name and repo_short_name in file_path:
                  relative_path = file_path

                  # Strip absolute runner path strings if present
                  if "/home/runner/work/" in relative_path:
                      relative_path = relative_path.split(repo_short_name + "/")[-1]
                  
                  # Strip the repo directory prefix if it still remains at the front
                  if repo_short_name and relative_path.startswith(repo_short_name + "/"):
                      relative_path = relative_path[len(repo_short_name + "/"):]
                      
                  # Clean up any residual formatting problems
                  relative_path = relative_path.lstrip("/")

              # Populate Rules Array (Ensure each rule ID is unique in the driver definitions)
              if rule_id not in seen_rules:
                  rules.append({
                      "id": rule_id,
                      "shortDescription": {
                          "text": short_desc
                      },
                      "help": {
                          "markdown": f"{short_desc}: {analysis}"
                      }
                  })
                  seen_rules.add(rule_id)
      
              # Map Severity to SARIF Level
              raw_severity = finding.get("severity", "MEDIUM").upper()
              level = severity_map.get(raw_severity, "warning")
      
              # Populate Results Array
              results.append({
                  "ruleId": rule_id,
                  "level": level,
                  "message": {
                      "text": analysis
                  },
                  "locations": [
                      {
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": relative_path,
                                  "uriBaseId": "%SRCROOT%"
                              },
                              "region": {
                                  "startLine": finding.get("start_line", 1),
                                  "endLine": finding.get("end_line", 1)
                              }
                          }
                      }
                  ]
              })

          # Construct Final SARIF Structure
          sarif_output = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "CodeMender",
                              "version": "0.7.0",
                              "rules": rules
                          }
                      },
                      "results": results
                  }
              ]
          }

          # Save corrected SARIF
          with open("output.sarif", "w") as f:
              f.write(json.dumps(sarif_output, indent=2))
              print(json.dumps(sarif_output, indent=2))'

      
      # Upload the SARIF payload directly to the target repository using the GitHub CLI
      - name: Upload SARIF directly via GitHub CLI
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Compress the SARIF file into GZIP Base64 format as required by the API
          SARIF_BASE64=$(gzip -c "output.sarif" | base64 -w 0)
          
          # 2. Extract the exact commit hash of the checked-out codebase
          COMMIT_SHA=$(git -C "${TARGET_REPO}" rev-parse HEAD)
          
          # 3. Safely resolve the active branch reference name
          BRANCH_REF=$(git -C "${TARGET_REPO}" symbolic-ref HEAD 2>/dev/null || echo "refs/heads/main")
          
          echo "Uploading SARIF payload natively to ${{ github.repository_owner }}/${TARGET_REPO}..."
          
          # 4. Execute the secure POST request directly through the GH CLI engine
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/code-scanning/sarifs" \
            -f commit_sha="$COMMIT_SHA" \
            -f ref="$BRANCH_REF" \
            -f sarif="$SARIF_BASE64" \
            -f tool_name="CodeMender"
      
      # Cleanup Sensitive Binaries (Best Practice)
      - name: Cleanup
        if: always()
        run: |
          rm -f cm-linux-amd64.zip
          rm -f cm
          rm -rf .cm_project
          rm -rf .exploit/
          rm -f gha-creds-*.json
  
  aggregate-results:
    needs: scan
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Download all artifacts matching the pattern into one directory
      - name: Download All Chunk Results
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-result-*
          merge-multiple: true
          path: all-results/

      - name: Merge Into Single JSON Object
        run: |
          python3 - << 'EOF'
          import glob
          import json
          import os

          # Structure 1: Keyed by directory path -> { "src/api": [...], "src/utils": [...] }
          by_path = {}

          # Structure 2: Consolidated flat list of all items across all chunks
          all_items = []

          files = glob.glob("all-results/*.json")
          print(f"Found {len(files)} chunk results to aggregate.")

          for filepath in sorted(files):
              with open(filepath, "r") as f:
                  chunk = json.load(f)
                  path_key = chunk.get("path", "unknown")
                  chunk_data = chunk.get("data", [])

                  by_path[path_key] = chunk_data
                  if isinstance(chunk_data, list):
                      all_items.extend(chunk_data)

          final_object = {
              "total_chunks": len(by_path),
              "total_items": len(all_items),
              "chunks": by_path,         # Keyed by chunk path
              "all_results": all_items    # Flattened list of all items
          }

          with open("aggregated_results.json", "w") as f:
              json.dump(final_object, f, indent=2)

          print("Successfully aggregated results.")
          EOF

      # Display summary directly on the GitHub Actions Run UI
      - name: Post Summary to Job Dashboard
        run: |
          python3 - << 'EOF'
          import json, os

          with open("aggregated_results.json") as f:
              data = json.load(f)

          summary = f"""### Analysis Aggregation Summary
          - **Total Chunks Processed:** {data['total_chunks']}
          - **Total Items Collected:** {data['total_items']}
          """
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          EOF

      # Persist the final combined JSON object
      - name: Upload Aggregated JSON
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-final-result
          path: aggregated_results.json
          retention-days: 14
